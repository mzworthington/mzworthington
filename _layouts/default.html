<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}" data-theme="folio">
{%- include head.html -%}
<body{% if page.layout == "home" %} class="is-home"{% elsif page.layout == "page" %} class="is-page"{% endif %}>
   {%- include header.html -%}
   <main>
      {{ content }}
   </main>
   {%- include footer.html -%}
   {%- include posthog.html -%}
   {%- assign asset_v = site.time | date: "%s" -%}
   <script src="{{ '/assets/js/theme.js' | relative_url | append: '?v=' | append: asset_v }}" defer></script>
</body>
{%- include pwa.html -%}
</html>
