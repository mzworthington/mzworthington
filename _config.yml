title: Agile Engineering. Reliable Results
author:
  name: Matthew Worthington
  email: matt@siliconpanda.com
  # twitter: worthington10
  picture: /assets/me.webp
description: >-
  Engineering leadership for delivery speed, reliable platforms, and teams that last.
baseurl: ""
url: "https://mzworthington.co.uk"
social_links:
  # twitter: worthington10
  github:  mzworthington
  # instagram: worthington10
  linkedin: worthington10
excerpt_separator: <!--more-->
locale: en_GB
plugins:
 - jekyll-feed
 - jekyll-seo-tag
 - jekyll-spaceship
 - jekyll-redirect-from
sass:
    sass_dir: _sass
    style: compact 
permalink: /:categories/:title
collections:
  category:
    output: true
include:
  - _headers
exclude:
  - README.md
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - bin/
  - mise.toml
