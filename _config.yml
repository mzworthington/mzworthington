title: Agile Engineering. Reliable Results
tagline: Engineering leadership for delivery speed, reliable platforms, and teams that last.
lang: en-GB
author:
  name: Matthew Z Worthington
  email: matt@siliconpanda.com
  # twitter: worthington10
  picture: /assets/me.webp
  url: https://mzworthington.co.uk/
description: >-
  Matthew Z Worthington is an engineering leader focused on delivery speed,
  reliable platforms, developer experience, and teams that last.
logo: /assets/android-chrome-512x512.png
url: "https://mzworthington.co.uk"
baseurl: ""
social:
  name: Matthew Z Worthington
  links:
    - https://github.com/mzworthington
    - https://www.linkedin.com/in/worthington10
social_links:
  # twitter: worthington10
  github:  mzworthington
  # instagram: worthington10
  linkedin: worthington10
excerpt_separator: <!--more-->
locale: en_GB
plugins:
 - jekyll-feed
 - jekyll-seo-tag
 - jekyll-sitemap
 - jekyll-spaceship
 - jekyll-redirect-from
defaults:
  - scope:
      path: ""
    values:
      image: /assets/og-default.png
sass:
    sass_dir: _sass
    style: compact 
permalink: /:categories/:title
collections:
  category:
    output: true
include:
  - _headers
  - robots.txt
exclude:
  - README.md
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - bin/
  - mise.toml
