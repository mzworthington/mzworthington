apiVersion: steerlens.dev/v1alpha1
kind: SteerTree
metadata:
  name: platform-transformation
  title: Platform transformation
  description: Sample workspace for Slice 1 demos and executive mockups
spec:
  vision: Deliver product value three times faster without burning out teams
  outcomes:
    - id: out_delivery
      title: 3× feature delivery
      summary: Year-on-year increase in features reaching customers
      status: on_track
      metrics:
        - id: met_delivery_rate
          title: Delivery rate
          unit: features/quarter
          current: 42
          baseline: 14
          target: 42
          interpretation: On the target run-rate
        - id: met_time_to_release
          title: Time to release
          unit: days
          current: 12
          baseline: 28
          target: 10
          interpretation: Improved, not yet at target
        - id: met_platform_wait
          title: Platform wait time
          unit: days
          current: 9
          baseline: 6
          target: 3
          interpretation: Bottleneck risk for two bets
  bets:
    - id: bet_pipeline
      outcomeId: out_delivery
      title: Discovery to rollout pipeline
      successSignal: Cross-team handoffs no longer dominate cycle time
      killCriteria: Lead time does not improve after one quarter of topology changes
      status: on_track
      fundedTeamIds: [team_checkout, team_sportsbook]
    - id: bet_idp
      outcomeId: out_delivery
      title: Shared platform golden paths
      successSignal: New services reach production via the golden path within one week
      killCriteria: Fewer than two product teams adopt the path after two quarters
      status: at_risk
      fundedTeamIds: [team_platform, team_checkout]
    - id: bet_obs
      outcomeId: out_delivery
      title: Observability unification
      successSignal: Incident time-to-diagnose drops by half
      killCriteria: Delivery rate unaffected after two quarters while cost rises
      status: stop_ready
      fundedTeamIds: [team_platform]
  teams:
    - id: team_checkout
      displayName: Customer checkout teams
      role: customer_facing
      provenance: local
      externalRefs: []
    - id: team_sportsbook
      displayName: Sportsbook product teams
      role: customer_facing
      provenance: local
      externalRefs: []
    - id: team_platform
      displayName: Shared platform
      role: shared_platform
      provenance: local
      externalRefs: []
    - id: team_devex
      displayName: Coaching support
      role: coaching_support
      provenance: local
      externalRefs: []
  relationships:
    - fromTeamId: team_checkout
      toTeamId: team_platform
      mode: uses_as_service
    - fromTeamId: team_sportsbook
      toTeamId: team_platform
      mode: uses_as_service
    - fromTeamId: team_devex
      toTeamId: team_checkout
      mode: coaching
  decisionNotes:
    - id: dec_obs_stop
      betId: bet_obs
      recommendation: stop
      title: Stop Observability unification?
      why: >
        Spend and coordination cost rose without a measurable lift in delivery rate.
        Incident diagnosis improved locally but not enough to justify the programme tax.
      measured:
        - Delivery rate unchanged quarter-on-quarter
        - Platform wait time increased
      affectedTeamIds: [team_platform, team_checkout]
      nextStep: Pause rollout; keep existing tooling for two quarters and revisit
  evidence:
    - id: ev_sample
      metricId: met_delivery_rate
      source: sample
      note: Sample data for Slice 1 · connect systems later for live evidence
