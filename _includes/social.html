{%- assign social = site.social_links -%}
<ul class="social-media-list">
   {%- if social.github -%}
   <li>
      <a rel="noreferrer" href="https://github.com/{{ social.github | cgi_escape | escape }}" target="_blank" aria-label="GitHub profile: {{ social.github | escape }}">
         <svg class="svg-icon" aria-hidden="true" focusable="false">
            <use xlink:href="{{ '/assets/social-icons.svg#github' | relative_url }}"></use>
         </svg>
      </a>
   </li>
   {%- endif -%}
   {%- if social.instagram -%}
   <li>
      <a rel="noreferrer" href="https://www.instagram.com/{{ social.instagram | cgi_escape | escape }}" target="_blank" aria-label="Instagram profile: {{ social.instagram | escape }}">
         <svg class="svg-icon" aria-hidden="true" focusable="false">
            <use xlink:href="{{ '/assets/social-icons.svg#instagram' | relative_url }}"></use>
         </svg>
      </a>
   </li>
   {%- endif -%}
   {%- if social.linkedin -%}
   <li>
      <a rel="noreferrer" href="https://www.linkedin.com/in/{{ social.linkedin | cgi_escape | escape }}" target="_blank" aria-label="LinkedIn profile: {{ social.linkedin | escape }}">
         <svg class="svg-icon" aria-hidden="true" focusable="false">
            <use xlink:href="{{ '/assets/social-icons.svg#linkedin' | relative_url }}"></use>
         </svg>
      </a>
   </li>
   {%- endif -%}
   {%- if social.twitter -%}
   <li>
      <a rel="noreferrer" href="https://twitter.com/{{ social.twitter | cgi_escape | escape }}" target="_blank" aria-label="Twitter profile: {{ social.twitter | escape }}">
         <svg class="svg-icon" aria-hidden="true" focusable="false">
            <use xlink:href="{{ '/assets/social-icons.svg#twitter' | relative_url }}"></use>
         </svg>
      </a>
   </li>
   {%- endif -%}
   <!-- <li>
      <a rel="me" href="{{ 'feed.xml' | relative_url }}" aria-label="RSS feed">
         <svg class="svg-icon" aria-hidden="true" focusable="false">
            <use xlink:href="{{ 'assets/social-icons.svg#rss' | relative_url }}"></use>
         </svg>
      </a>
   </li> -->
</ul>
