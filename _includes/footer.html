<footer>
  <a class="u-url visually-hidden" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
  <address>
     {{ site.author.name | escape }} <br/>
     <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
   </address>
  <section>
     {%- include social.html -%}
     {%- if page.layout == "home" -%}
     <p class="print-cv">
        <button type="button" class="print-cv__button" data-print-cv>Print / PDF CV</button>
     </p>
     {%- endif -%}
  </section>
</footer>
