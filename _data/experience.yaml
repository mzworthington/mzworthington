        - <b>Organisational Design</b>Reduced cross-team dependencies by optimising team topology and streamlining the "Discovery to Rollout" pipeline.
        - <b>Deployment Frequency</b>Accelerated release cycles by implementing automated testing and CI/CD enhancements, significantly increasing deployment confidence.
    - name: Reliability & Infrastructure
      description: |
        - <b>Unified Observability</b>Orchestrated the rollout of a centralised observability platform across vast multicloud tech estate.
        - <b>Automated Incident Response</b>Reduced Root Cause Analysis (RCA) time by deploying an automated, multi-cloud service map for real-time incident tracking.
        - <b>Global Infrastructure</b>Integrated all major cloud providers and PaaS suppliers into a unified developer platform.
        - <b>Real-time FinOps</b>Established granular cloud-spend visibility with real-time budget tracking from individual teams to vertical business units.
    - name: Developer Experience (DevEx) & Platform Engineering
