intro: |
  I build alongside the teams I lead, focused on the same problems I prioritise as an engineering leader: architecture clarity, developer experience, delivery standards, and operational visibility.

groups:
  - title: ArchLens
    description: |
      Platform, intelligence, resilience, and contract - composed around BlueprintSpec.
    link: https://archlens.dev
    projects:
      - title: ArchLens Canvas
        description: |
          Local-first C4 workspace with bi-directional YAML sync - the place teams refine and govern the live diagram.
        link: https://archlens.dev/guide/canvas

      - title: ArchLens CLI
        description: |
          Static analysis that discovers systems, containers, and dependencies - keeping blueprints aligned with production.
        link: https://archlens.dev/guide/cli

      - title: TraceLens
        description: |
          Git churn, complexity, and coupling on every node - highlight hotspots and refactoring boundaries early.
        link: https://archlens.dev/guide/tracelens

      - title: ChaosLens
        description: |
          Model faults on the live diagram, see blast radius and SLA impact, and catch single points of failure in review.
        link: https://archlens.dev/guide/chaoslens

      - title: AdviceLens
        description: |
          Merge TraceLens and ChaosLens signals into evidence-backed recommendations: studio, CLI, and CI.
        link: https://archlens.dev/guide/advicelens

      - title: BlueprintSpec
        description: |
          Declarative YAML schema and entity references your CLI, canvas, and CI pipelines can validate against.
        link: https://archlens.dev/guide/schema

projects:
  - title: Waykit
    description: |
      The SDLC coding agents actually run. Skills and SOPs are a live graph, not a second catalog. EDD is the loop when the change is a prompt or a tool.
    link: https://waykit.dev
    
  - title: SteerCo
    description: |
      Steering workspace for investment clarity: outcomes, bets, organisation shape, and decision notes.
    link: https://steerco.mzworthington.co.uk
    
  - title: GPIO build monitor
    description: |
      Glanceable CI status for GitHub Actions and CircleCI: live on the web, or glowing on a Raspberry Pi desk light.
    link: https://monitor.mzworthington.co.uk

  - title: React on Cloudflare
    description: |
      Hosting, docs, and CI already wired, so day one is product work, not plumbing.
    link: https://react-cloudflare-template.mzworthington.co.uk

  - title: dotfiles
    description: |
      Personal macOS machine setup: shell config, Homebrew and mise tooling, and bootstrap scripts for a fresh machine.
    link: https://github.com/mzworthington/dotfiles
